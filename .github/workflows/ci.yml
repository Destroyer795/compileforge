name: CompileForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-11
            cxx: g++-11
          - os: ubuntu-latest
            compiler: clang-14
            cxx: clang++-14
          - os: windows-latest
            compiler: msvc
            cxx: cl
          - os: macos-latest
            compiler: apple-clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }} cmake build-essential

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOMPILEFORGE_BUILD_TESTS=ON -DCOMPILEFORGE_BUILD_BENCHMARKS=ON

      - name: Build CompileForge
        run: |
          cmake --build build --config Release

      - name: Run Unit & Integration Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Run Benchmarks
        shell: bash
        run: |
          if [ -f "./build/compileforge_benchmarks" ]; then
            ./build/compileforge_benchmarks
          elif [ -f "./build/Release/compileforge_benchmarks.exe" ]; then
            ./build/Release/compileforge_benchmarks.exe
          elif [ -f "./build/compileforge_benchmarks.exe" ]; then
            ./build/compileforge_benchmarks.exe
          fi

      - name: Test Sample Analysis Command
        shell: bash
        run: |
          if [ -f "./build/compileforge" ]; then
            ./build/compileforge analyze ./examples/synthetic_large_project --format json --output test_report.json
          elif [ -f "./build/Release/compileforge.exe" ]; then
            ./build/Release/compileforge.exe analyze ./examples/synthetic_large_project --format json --output test_report.json
          elif [ -f "./build/compileforge.exe" ]; then
            ./build/compileforge.exe analyze ./examples/synthetic_large_project --format json --output test_report.json
          fi
